<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roads Along Reefs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       GAME CONTAINER  (16:9 letterboxed)
  ═══════════════════════════════════════════ -->
  <div id="game-container">

    <!-- ── MAIN MENU SCREEN ─────────────────── -->
    <div id="menu-screen" class="screen active">

      <!-- All images are 692×492 full-canvas frames, stacked directly here -->
      <img id="menu-bg"     src="assets/titlescreen/menu_bg.png"     alt=""                  /><!-- z0 -->
      <img id="menu-truck"  src="assets/titlescreen/menu_truck.png"  alt="Food Truck"        /><!-- z1 -->
      <img id="menu-title"  src="assets/titlescreen/menu_title.png"  alt="Roads Along Reefs" /><!-- z2 -->
      <img id="stickbtn"    src="assets/titlescreen/stickbtn.png"    alt=""                  /><!-- z3 -->
      <img id="playbtn"     src="assets/titlescreen/playbtn.png"     alt="Play"              /><!-- z4 -->
      <img id="settingsbtn" src="assets/titlescreen/settingsbtn.png" alt="Settings"          /><!-- z5 -->
      <img id="loadbtn"     src="assets/titlescreen/loadbtn.png"     alt="Save/Load"         /><!-- z6 -->

      <!-- Invisible hit areas — z-index 10, sit above all images -->
      <div id="hit-truck"    class="menu-hit" data-target="menu-truck"  data-action="truck"></div>
      <div id="hit-title"    class="menu-hit" data-target="menu-title"  data-action="title"></div>
      <div id="hit-play"     class="menu-hit" data-target="playbtn"     data-action="play"></div>
      <div id="hit-settings" class="menu-hit" data-target="settingsbtn" data-action="settings"></div>
      <div id="hit-load"     class="menu-hit" data-target="loadbtn"     data-action="load"></div>

    </div><!-- /menu-screen -->


    <!-- ── CUTSCENE SCREEN ──────────────────── -->
    <div id="cutscene-screen" class="screen hidden">
      <div id="cutscene-bg"></div>

      <!-- accumulate in order; getajob & flyerpapers both on top layer -->
      <img class="cutscene-img" id="cs-cutscene1"   src="assets/cutscene1/cutscene1.png"   alt="" draggable="false" />
      <img class="cutscene-img" id="cs-getajob"     src="assets/cutscene1/getajob.png"     alt="" draggable="false" style="z-index:100;" />
      <img class="cutscene-img" id="cs-flyerpapers" src="assets/cutscene1/flyerpapers.png" alt="" draggable="false" style="z-index:100;" />
      <img class="cutscene-img" id="cs-cutscene2"   src="assets/cutscene1/cutscene2.png"   alt="" draggable="false" />
      <img class="cutscene-img" id="cs-cutscene3"   src="assets/cutscene1/cutscene3.png"   alt="" draggable="false" />

      <div id="cutscene-hint">Click or press <kbd>Space</kbd> / <kbd>Enter</kbd> to continue</div>
    </div><!-- /cutscene-screen -->


    <!-- ── SCENE 2 — desk scene ─────────────── -->
    <div id="scene2-screen" class="screen hidden">

      <!-- Layer 0: table background -->
      <img id="scene2-table"      src="assets/scene2/scene2_table.png"      alt="" draggable="false" />
      <!-- Layer 1: table stuff (clutter) -->
      <img id="scene2-tablestuff" src="assets/scene2/scene2_tablestuff.png" alt="" draggable="false" />
      <!-- Layer 2: poster -->
      <img id="scene2-poster"     src="assets/scene2/scene2_poster.png"     alt="" draggable="false" />
      <!-- Layer 3: phone (top, clickable via hit div) -->
      <img id="scene2-phone"      src="assets/scene2/scene2_phone.png"      alt="Phone" draggable="false" />

      <!-- Invisible hit area over the phone -->
      <div id="hit-phone"></div>

    </div><!-- /scene2-screen -->


    <!-- ── SCENE TRANSITION OVERLAY ──────────── -->
    <!-- Sits above every screen; fades to black between scenes -->
    <div id="scene-transition"></div>

  </div><!-- /game-container -->


  <!-- ═══════════════════════════════════════════
       SETTINGS MODAL
  ═══════════════════════════════════════════ -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="panel">
      <h2 class="panel-title" id="settings-title">⚙️ Settings</h2>
      <button class="close-btn" id="settings-close" aria-label="Close settings">✕</button>

      <!-- Tab bar -->
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="audio">🔊 Audio</button>
        <button class="tab-btn"        role="tab" data-tab="controls">🎮 Controls</button>
        <button class="tab-btn"        role="tab" data-tab="graphics">🖥️ Graphics</button>
        <button class="tab-btn"        role="tab" data-tab="accessibility">♿ Access.</button>
        <button class="tab-btn"        role="tab" data-tab="game">🐱 Game</button>
      </div>

      <!-- AUDIO -->
      <div class="tab-content" id="tab-audio" role="tabpanel">
        <div class="setting-row">
          <label for="master-vol">Master Volume</label>
          <input type="range" id="master-vol" min="0" max="100" value="80" />
          <span class="range-val" id="master-vol-val">80</span>
        </div>
        <div class="setting-row">
          <label for="music-vol">Music</label>
          <input type="range" id="music-vol" min="0" max="100" value="70" />
          <span class="range-val" id="music-vol-val">70</span>
        </div>
        <div class="setting-row">
          <label for="sfx-vol">Sound Effects</label>
          <input type="range" id="sfx-vol" min="0" max="100" value="90" />
          <span class="range-val" id="sfx-vol-val">90</span>
        </div>
        <div class="setting-row">
          <label for="ambient-vol">Ambience</label>
          <input type="range" id="ambient-vol" min="0" max="100" value="50" />
          <span class="range-val" id="ambient-vol-val">50</span>
        </div>
        <div class="setting-row">
          <label for="mute-toggle">Mute All</label>
          <label class="toggle-switch">
            <input type="checkbox" id="mute-toggle" />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="tab-content hidden" id="tab-controls" role="tabpanel">
        <p class="tab-note">Click a key chip to rebind it.</p>
        <div class="setting-row">
          <label>Move Up</label>
          <span class="keybind" data-action="up">W</span>
        </div>
        <div class="setting-row">
          <label>Move Down</label>
          <span class="keybind" data-action="down">S</span>
        </div>
        <div class="setting-row">
          <label>Move Left</label>
          <span class="keybind" data-action="left">A</span>
        </div>
        <div class="setting-row">
          <label>Move Right</label>
          <span class="keybind" data-action="right">D</span>
        </div>
        <div class="setting-row">
          <label>Interact / Serve</label>
          <span class="keybind" data-action="interact">E</span>
        </div>
        <div class="setting-row">
          <label>Pause</label>
          <span class="keybind" data-action="pause">Esc</span>
        </div>
        <div class="setting-row">
          <label>Skip Cutscene</label>
          <span class="keybind" data-action="skip">Space</span>
        </div>
      </div>

      <!-- GRAPHICS / DISPLAY -->
      <div class="tab-content hidden" id="tab-graphics" role="tabpanel">
        <div class="setting-row">
          <label for="resolution">Resolution</label>
          <select class="styled-select" id="resolution">
            <option value="1920x1080">1920 × 1080</option>
            <option value="1280x720" selected>1280 × 720</option>
            <option value="854x480">854 × 480</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="fullscreen-toggle">Fullscreen</label>
          <label class="toggle-switch">
            <input type="checkbox" id="fullscreen-toggle" />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="vsync-toggle">V-Sync</label>
          <label class="toggle-switch">
            <input type="checkbox" id="vsync-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="brightness">Brightness</label>
          <input type="range" id="brightness" min="50" max="150" value="100" />
          <span class="range-val" id="brightness-val">100</span>
        </div>
        <div class="setting-row">
          <label for="particle-toggle">Particles / Effects</label>
          <label class="toggle-switch">
            <input type="checkbox" id="particle-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <!-- ACCESSIBILITY -->
      <div class="tab-content hidden" id="tab-accessibility" role="tabpanel">
        <div class="setting-row">
          <label for="text-size">Text Size</label>
          <select class="styled-select" id="text-size">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="colorblind">Colour-Blind Mode</label>
          <select class="styled-select" id="colorblind">
            <option value="none" selected>None</option>
            <option value="protanopia">Protanopia</option>
            <option value="deuteranopia">Deuteranopia</option>
            <option value="tritanopia">Tritanopia</option>
            <option value="achromatopsia">Greyscale</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="reduce-motion">Reduce Motion</label>
          <label class="toggle-switch">
            <input type="checkbox" id="reduce-motion" />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="high-contrast">High Contrast UI</label>
          <label class="toggle-switch">
            <input type="checkbox" id="high-contrast" />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="screen-reader">Screen-Reader Hints</label>
          <label class="toggle-switch">
            <input type="checkbox" id="screen-reader" />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <!-- GAME OPTIONS -->
      <div class="tab-content hidden" id="tab-game" role="tabpanel">
        <div class="setting-row">
          <label for="lang">Language</label>
          <select class="styled-select" id="lang">
            <option value="en" selected>English</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="zh">中文</option>
            <option value="ta">தமிழ்</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="difficulty">Difficulty</label>
          <select class="styled-select" id="difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="tutorial-toggle">Show Tutorials</label>
          <label class="toggle-switch">
            <input type="checkbox" id="tutorial-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="autosave-toggle">Auto-Save</label>
          <label class="toggle-switch">
            <input type="checkbox" id="autosave-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="setting-row">
          <label for="sdg-tips">SDG Tips in-game</label>
          <label class="toggle-switch">
            <input type="checkbox" id="sdg-tips" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <div class="panel-footer">
        <button class="footer-btn" id="settings-reset">Reset Defaults</button>
        <button class="footer-btn primary" id="settings-apply">Apply</button>
      </div>
    </div>
  </div><!-- /settings-modal -->


  <!-- ═══════════════════════════════════════════
       SAVE / LOAD MODAL
  ═══════════════════════════════════════════ -->
  <div id="load-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="load-title">
    <div class="panel">
      <h2 class="panel-title" id="load-title">💾 Save / Load</h2>
      <button class="close-btn" id="load-close" aria-label="Close save/load">✕</button>

      <div class="save-slots" id="save-slots-container">
        <!-- Slots injected by JS -->
      </div>

      <div class="panel-footer">
        <button class="footer-btn" id="load-close-btn">Close</button>
      </div>
    </div>
  </div><!-- /load-modal -->


  <!-- ── MUSIC ─────────────────────────────────── -->
  <audio id="menu-music" loop preload="auto">
    <source src="assets/music/main_menu_music.mp3" type="audio/mpeg" />
  </audio>
  <audio id="scene2-music" loop preload="auto">
    <source src="assets/music/scene2_music.mp3" type="audio/mpeg" />
  </audio>

  <!-- ── SFX ──────────────────────────────────── -->
  <audio id="sfx-angry-meow"  preload="auto"><source src="assets/sfx/angry_meow.mp3"  type="audio/mpeg" /></audio>
  <audio id="sfx-paperslam"   preload="auto"><source src="assets/sfx/paperslam.mp3"   type="audio/mpeg" /></audio>
  <audio id="sfx-angry-meow2" preload="auto"><source src="assets/sfx/angry_meow2.mp3" type="audio/mpeg" /></audio>

  <script src="script.js"></script>
</body>
</html>
