<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roads Along Reefs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       GAME CONTAINER  (16:9 letterboxed)
  ═══════════════════════════════════════════ -->
  <div id="game-container">

    <!-- ── MAIN MENU SCREEN ─────────────────── -->
    <div id="menu-screen" class="screen active">

      <!-- All images are 692×492 full-canvas frames, stacked directly here -->
      <img id="menu-bg"     src="assets/titlescreen/menu_bg.png"     alt=""                  /><!-- z0 -->
      <img id="menu-truck"  src="assets/titlescreen/menu_truck.png"  alt="Food Truck"        /><!-- z1 -->
      <img id="menu-title"  src="assets/titlescreen/menu_title.png"  alt="Roads Along Reefs" /><!-- z2 -->
      <img id="stickbtn"    src="assets/titlescreen/stickbtn.png"    alt=""                  /><!-- z3 -->
      <img id="playbtn"     src="assets/titlescreen/playbtn.png"     alt="Play"              /><!-- z4 -->
      <img id="settingsbtn" src="assets/titlescreen/settingsbtn.png" alt="Settings"          /><!-- z5 -->
      <img id="loadbtn"     src="assets/titlescreen/loadbtn.png"     alt="Save/Load"         /><!-- z6 -->

      <!-- hit-play / hit-settings / hit-load replaced by pixel-colour detection in script.js -->
      <div id="hit-truck" class="menu-hit" data-target="menu-truck" data-action="truck"></div>
      <div id="hit-title" class="menu-hit" data-target="menu-title" data-action="title"></div>

    </div><!-- /menu-screen -->


    <!-- ── CUTSCENE SCREEN ──────────────────── -->
    <div id="cutscene-screen" class="screen hidden">
      <div id="cutscene-bg"></div>

      <!-- accumulate in order; getajob & flyerpapers both on top layer -->
      <img class="cutscene-img" id="cs-cutscene1"   src="assets/cutscene1/cutscene1.png"   alt="" draggable="false" />
      <img class="cutscene-img" id="cs-getajob"     src="assets/cutscene1/getajob.png"     alt="" draggable="false" style="z-index:100;" />
      <img class="cutscene-img" id="cs-flyerpapers" src="assets/cutscene1/flyerpapers.png" alt="" draggable="false" style="z-index:100;" />
      <img class="cutscene-img" id="cs-cutscene2"   src="assets/cutscene1/cutscene2.png"   alt="" draggable="false" />
      <img class="cutscene-img" id="cs-cutscene3"   src="assets/cutscene1/cutscene3.png"   alt="" draggable="false" />

      <div id="cutscene-hint">Click or press <kbd>Space</kbd> / <kbd>Enter</kbd> to continue</div>
    </div><!-- /cutscene-screen -->


    <!-- ── SCENE 2 — desk scene ─────────────── -->
    <div id="scene2-screen" class="screen hidden">

      <!-- Layer 0: table background -->
      <img id="scene2-table"      src="assets/scene2/scene2_table.png"      alt="" draggable="false" />
      <!-- Layer 1: table stuff (clutter) -->
      <img id="scene2-tablestuff" src="assets/scene2/scene2_tablestuff.png" alt="" draggable="false" />
      <!-- Layer 2: poster -->
      <img id="scene2-poster"     src="assets/scene2/scene2_poster.png"     alt="" draggable="false" />
      <!-- Layer 3: phone (top, clickable via hit div) -->
      <img id="scene2-phone"      src="assets/scene2/scene2_phone.png"      alt="Phone" draggable="false" />

      <!-- Invisible hit area over the phone -->
      <div id="hit-phone"></div>

    </div><!-- /scene2-screen -->


    <!-- ── SCENE TRANSITION OVERLAY ──────────── -->
    <!-- Sits above every screen; fades to black between scenes -->
    <div id="scene-transition"></div>

  </div><!-- /game-container -->


  <!-- ═══════════════════════════════════════════
       SETTINGS MODAL
  ═══════════════════════════════════════════ -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="panel">
      <h2 class="panel-title" id="settings-title" data-i18n="settings-title">⚙️ Settings</h2>
      <button class="close-btn" id="settings-close" aria-label="Close settings">✕</button>

      <!-- Tab bar -->
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="audio"         data-i18n="tab-audio">🔊 Audio</button>
        <button class="tab-btn"        role="tab" data-tab="accessibility" data-i18n="tab-accessibility">♿ Access.</button>
        <button class="tab-btn"        role="tab" data-tab="game"          data-i18n="tab-game">🐱 Game</button>
      </div>

      <!-- AUDIO -->
      <div class="tab-content" id="tab-audio" role="tabpanel">
        <div class="setting-row">
          <label for="master-vol" data-i18n="lbl-master-vol">Master Volume</label>
          <input type="range" id="master-vol" min="0" max="100" value="80" />
          <span class="range-val" id="master-vol-val">80</span>
        </div>
        <div class="setting-row">
          <label for="music-vol" data-i18n="lbl-music-vol">Music</label>
          <input type="range" id="music-vol" min="0" max="100" value="70" />
          <span class="range-val" id="music-vol-val">70</span>
        </div>
        <div class="setting-row">
          <label for="sfx-vol" data-i18n="lbl-sfx-vol">Sound Effects</label>
          <input type="range" id="sfx-vol" min="0" max="100" value="90" />
          <span class="range-val" id="sfx-vol-val">90</span>
        </div>
        <div class="setting-row">
          <label for="mute-toggle" data-i18n="lbl-mute-toggle">Mute All</label>
          <label class="toggle-switch">
            <input type="checkbox" id="mute-toggle" />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <!-- ACCESSIBILITY -->
      <div class="tab-content hidden" id="tab-accessibility" role="tabpanel">
        <div class="setting-row">
          <label for="text-size" data-i18n="lbl-text-size">Text Size</label>
          <select class="styled-select" id="text-size">
            <option value="small"  data-i18n-opt="opt-small">Small</option>
            <option value="medium" data-i18n-opt="opt-medium" selected>Medium</option>
            <option value="large"  data-i18n-opt="opt-large">Large</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="colorblind" data-i18n="lbl-colorblind">Colour-Blind Mode</label>
          <select class="styled-select" id="colorblind">
            <option value="none"          data-i18n-opt="opt-cb-none"   selected>None</option>
            <option value="protanopia"    data-i18n-opt="opt-cb-prot">Protanopia</option>
            <option value="deuteranopia"  data-i18n-opt="opt-cb-deut">Deuteranopia</option>
            <option value="tritanopia"    data-i18n-opt="opt-cb-trit">Tritanopia</option>
            <option value="achromatopsia" data-i18n-opt="opt-cb-grey">Greyscale</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="high-contrast" data-i18n="lbl-high-contrast">High Contrast UI</label>
          <label class="toggle-switch">
            <input type="checkbox" id="high-contrast" />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <!-- GAME OPTIONS -->
      <div class="tab-content hidden" id="tab-game" role="tabpanel">
        <div class="setting-row">
          <label for="lang" data-i18n="lbl-lang">Language</label>
          <select class="styled-select" id="lang">
            <option value="en" selected>English</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="zh">中文</option>
            <option value="ta">தமிழ்</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="autosave-toggle" data-i18n="lbl-autosave">Auto-Save</label>
          <label class="toggle-switch">
            <input type="checkbox" id="autosave-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <div class="panel-footer">
        <button class="footer-btn" id="settings-reset" data-i18n="btn-reset">Reset Defaults</button>
        <button class="footer-btn primary" id="settings-apply" data-i18n="btn-apply">Apply</button>
      </div>
    </div>
  </div><!-- /settings-modal -->


  <!-- ═══════════════════════════════════════════
       SAVE / LOAD MODAL
  ═══════════════════════════════════════════ -->
  <div id="load-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="load-title">
    <div class="panel">
      <h2 class="panel-title" id="load-title" data-i18n="load-title">💾 Save / Load</h2>
      <button class="close-btn" id="load-close" aria-label="Close save/load">✕</button>

      <div class="save-slots" id="save-slots-container">
        <!-- Slots injected by JS -->
      </div>

      <div class="panel-footer">
        <button class="footer-btn" id="load-close-btn" data-i18n="btn-load-close">Close</button>
      </div>
    </div>
  </div><!-- /load-modal -->


  <!-- ── SFX UI ────────────────────────────────── -->
  <audio id="sfx-click" preload="auto"><source src="assets/sfx/click.mp3"  type="audio/mpeg" /></audio>
  <audio id="sfx-close" preload="auto"><source src="assets/sfx/close.mp3"  type="audio/mpeg" /></audio>

  <!-- ── MUSIC ─────────────────────────────────── -->
  <audio id="menu-music" loop preload="auto">
    <source src="assets/music/main_menu_music.mp3" type="audio/mpeg" />
  </audio>
  <audio id="scene2-music" loop preload="auto">
    <source src="assets/music/scene2_music.mp3" type="audio/mpeg" />
  </audio>

  <!-- ── SFX ──────────────────────────────────── -->
  <audio id="sfx-angry-meow"  preload="auto"><source src="assets/sfx/angry_meow.mp3"  type="audio/mpeg" /></audio>
  <audio id="sfx-paperslam"   preload="auto"><source src="assets/sfx/paperslam.mp3"   type="audio/mpeg" /></audio>
  <audio id="sfx-angry-meow2" preload="auto"><source src="assets/sfx/angry_meow2.mp3" type="audio/mpeg" /></audio>

  <!-- ── SVG colourblind filter definitions (hidden) ── -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <!-- Protanopia (red-blind) -->
      <filter id="cb-protanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.567 0.433 0     0 0
          0.558 0.442 0     0 0
          0     0.242 0.758 0 0
          0     0     0     1 0"/>
      </filter>
      <!-- Deuteranopia (green-blind) -->
      <filter id="cb-deuteranopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.625 0.375 0   0 0
          0.7   0.3   0   0 0
          0     0.3   0.7 0 0
          0     0     0   1 0"/>
      </filter>
      <!-- Tritanopia (blue-blind) -->
      <filter id="cb-tritanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.95  0.05  0     0 0
          0     0.433 0.567 0 0
          0     0.475 0.525 0 0
          0     0     0     1 0"/>
      </filter>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
